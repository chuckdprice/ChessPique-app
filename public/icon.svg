  <path d="M34 147h27l12-13 14 21 15-16h44" fill="none" stroke="url(#pulse)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="146" cy="139" r="6.5" fill="#ffd166" stroke="#fff3c4" stroke-width="2"/>

