<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180" role="img" aria-labelledby="title desc">
  <title id="title">ChessPique app icon</title>
  <desc id="desc">A stylized ivory chess knight over an analytical pulse line on a midnight indigo tile.</desc>
  <defs>
